# CI do fork alexgauna/DFe.NET (branch compat/dotnet10 e derivadas).
# - Build e testes em net10.0 no Windows e no Linux.
# - Empacota AlexGauna.DFe.* (lib/net10.0).
# - Publica no GitHub Packages SOMENTE em tag v*. Nunca publica no nuget.org.
name: fork-ci

on:
  push:
    branches: [ 'compat/**', 'release/**', 'bugfix/**', 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'compat/**', 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2025 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Testes NF-e (net10.0)
        shell: bash
        run: |
          set -e
          FILTER=""
          # PdfClown depende de System.Drawing.Common (somente Windows) — ver CHANGELOG-FORK.md
          if [ "$RUNNER_OS" = "Linux" ]; then FILTER='--filter FullyQualifiedName!~DanfePdfClown'; fi
          for p in NFe.Utils.Testes NFe.Classes.Testes DFe.Testes; do
            dotnet test "$p/$p.csproj" -c Release $FILTER
          done
      - name: Build dos projetos empacotados (net10.0)
        shell: bash
        run: |
          dotnet build NFe.Servicos/NFe.Servicos.csproj -c Release -f net10.0
          dotnet build NFe.Danfe.Html/NFe.Danfe.Html.csproj -c Release -f net10.0

  pack:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Versão
        id: ver
        shell: bash
        run: |
          UPSTREAM=$(cut -c1-8 .fork/upstream-base)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BASE="${GITHUB_REF#refs/tags/v}"
          else
            BASE="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "version=${BASE}+zeus.${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "upstream=$(cat .fork/upstream-base)" >> "$GITHUB_OUTPUT"
      - name: Build Release net10.0
        # Versão do pacote gravada nos assemblies (InformationalVersion inclui o commit upstream de base)
        run: |
          dotnet build NFe.Servicos/NFe.Servicos.csproj -c Release -f net10.0 \
            "-p:Version=${{ steps.ver.outputs.base }}" "-p:InformationalVersion=${{ steps.ver.outputs.version }}"
      - name: Pack
        shell: bash
        run: |
          PROPS="version=${{ steps.ver.outputs.version }};commit=${GITHUB_SHA};upstream=${{ steps.ver.outputs.upstream }}"
          for p in AlexGauna.DFe.NFe.NFCe; do
            dotnet pack "NuGet/$p/$p.csproj" -c Release -o out "-p:NuspecProperties=\"$PROPS\""
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: out/*.nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: out
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Push para GitHub Packages
        run: |
          dotnet nuget push "out/*.nupkg" \
            --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
